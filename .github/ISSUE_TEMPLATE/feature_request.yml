name: Feature request
description: An idea for the API, a fold-aware layout, a platform or the docs.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The screen or device behavior you have in mind, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: An API sketch or a code example helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
